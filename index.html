<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estoque</title>
<meta name="description" content="Confira nosso estoque de veículos.">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="index">

<div data-layout="header"></div>

<!-- Banner da home. Troque a imagem em assets/img/banner-home.png ou em SITE.banner -->
<section class="hero" data-hero></section>

<div class="page">
  <div class="layout">

    <!-- Sidebar de filtros (montada por estoque.js a partir dos dados) -->
    <aside id="sidebar" class="sidebar">
      <h4>
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 9c.552 0 1 .449 1 1s-.448 1-1 1-1-.449-1-1 .448-1 1-1zm0-2c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3-1.343-3-3-3zm-9 4c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3-1.343-3-3-3zm18 0c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3-1.343-3-3-3zm-9-6c.343 0 .677.035 1 .101v-3.101c0-.552-.447-1-1-1s-1 .448-1 1v3.101c.323-.066.657-.101 1-.101zm9 4c.343 0 .677.035 1 .101v-7.101c0-.552-.447-1-1-1s-1 .448-1 1v7.101c.323-.066.657-.101 1-.101zm0 10c-.343 0-.677-.035-1-.101v3.101c0 .552.447 1 1 1s1-.448 1-1v-3.101c-.323.066-.657.101-1 .101zm-18-10c.343 0 .677.035 1 .101v-7.101c0-.552-.447-1-1-1s-1 .448-1 1v7.101c.323-.066.657-.101 1-.101zm9 6c-.343 0-.677-.035-1-.101v7.101c0 .552.447 1 1 1s1-.448 1-1v-7.101c-.323.066-.657.101-1 .101zm-9 4c-.343 0-.677-.035-1-.101v3.101c0 .552.447 1 1 1s1-.448 1-1v-3.101c-.323.066-.657.101-1 .101z"/></svg>
        Filtrar resultado
      </h4>
      <form id="form-filtro"></form>
    </aside>
    <div class="aplicar-filtro">
      <button type="button" class="btn btn-danger btn-block btn-lg" data-toggle-sidebar>Ver resultados</button>
    </div>

    <!-- Resultados -->
    <main class="main">
      <div class="row-order-filter">
        <button type="button" class="btn btn-primary btn-filtro-mobile" data-toggle-sidebar>Filtrar</button>

        <div class="busca-rapida">
          <select id="select-make" class="form-control" aria-label="Marca">
            <option value="">Selecione a marca</option>
          </select>
          <select id="select-model" class="form-control" aria-label="Modelo">
            <option value="">Selecione o modelo</option>
          </select>
        </div>

        <div class="order">
          <select id="order" class="form-control" aria-label="Ordenar por">
            <option value="">Ordenar por...</option>
            <option value="preco asc">Menor preço</option>
            <option value="preco desc">Maior preço</option>
            <option value="ano asc">Menor ano</option>
            <option value="ano desc">Maior ano</option>
            <option value="modelo asc">A-Z</option>
            <option value="modelo desc">Z-A</option>
          </select>
        </div>
      </div>

      <h1 class="tit-estoque-result" id="titulo-resultado">Estoque</h1>

      <div class="veiculos-grid" id="veiculos-grid"></div>

      <div class="show-more" id="show-more" hidden>
        <button type="button" class="btn btn-primary btn-lg" data-mostrar-mais>
          Mostrar mais
          <svg width="12" height="12" viewBox="0 0 24 24"><path d="M0 7.33l2.829-2.83 9.175 9.339 9.167-9.339 2.829 2.83-11.996 12.17z"/></svg>
        </button>
      </div>
    </main>

  </div>
</div>

<div data-layout="footer"></div>

<script src="assets/js/site.config.js"></script>
<script src="assets/js/config.supabase.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/dados.js"></script>
<script src="assets/js/fonte.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/estoque.js"></script>
</body>
</html>
